[project]
name = "backend"
version = "0.1.0"
package-mode = false
description = " Backend de sistema POS de ventas"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "aioboto3>=15.5.0",
    "celery[redis]>=5.6.2",
    "jinja2>=3.1.6",
    "fastapi-mail>=1.6.2",
    "logfire[celery,fastapi,redis,sqlalchemy]>=4.29.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "python-multipart>=0.0.26",
    "sqlmodel>=0.0.31",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
api = [
    "alembic>=1.18.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "fastapi-pagination>=0.15.5",
    "fastapi-querybuilder>=0.1.13",
    "gunicorn>=25.1.0",
    "pyjwt>=2.11.0",
    "supertokens-python @ git+https://github.com/supertokens/supertokens-python.git@dc4e5e7520958c3c1e91e2dcac4772de1ea4ae6e",
]
back-task = [
    "qrcode[pil]>=7.4.2",
    "weasyprint>=67.0",
]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
    "uvicorn[standard]>=0.40.0",
]
