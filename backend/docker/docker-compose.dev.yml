services:
  api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api-dev
      args:
        PORT: 8080
        
    env_file:
      - ../../.env

    volumes:
      - ../src:/app/src:cached

    ports:
      - "${PORT:-8080}:8080"
    
    command: >
      python src/main.py
    
    depends_on:
      supertokens:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  supertokens:
    image: supertokens/supertokens-postgresql:latest
    environment:
      POSTGRESQL_CONNECTION_URI: "${SUPERTOKENS_DB_URI}"

    ports:
      - "${SUPERTOKENS_PORT:-3567}:3567"

    volumes:
      - supertokens_data_dev:/var/lib/supertokens

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3567/hello || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

    restart: unless-stopped
  
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-password}
    volumes:
      - redis-data:/data
      - ../redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker-invoices:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: back-task-dev
    env_file:
      - ../../.env
    command: >
      celery -A src.celery_app worker -Q invoices -n invoices.%h --concurrency=${CONCURRENCY_INVOICES:-2} --loglevel=${CELERY_LOGLEVEL:-info} --max-tasks-per-child=${MAX_TASKS_PER_CHILD_INVOICES:-50}
    volumes:
      - /app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: back-task-dev
    env_file:
      - ../../.env
    command: >
      celery -A src.celery_app worker -Q cron -n cron.%h --concurrency=${CONCURRENCY_CRON:-1} --loglevel=${CELERY_LOGLEVEL:-info} --max-tasks-per-child=${MAX_TASKS_PER_CHILD_CRON:-200}
    volumes:
      - /app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: back-task-dev
    env_file:
      - ../../.env
    command: >
      celery -A src.celery_app:app beat
      --loglevel=${CELERY_LOGLEVEL:-info}
      --pidfile=/tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    volumes:
      - /app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  supertokens_data_dev:
